## An Alpha core dump: check that lldb reads the register notes and unwinds.
## The general-purpose note holds $0-$29, then the user stack pointer, the pc
## and the thread pointer; the floating-point note holds $f0-$f30 and then the
## control register in the slot $f31 would occupy.

# RUN: yaml2obj %s -o %t
# RUN: %lldb -c %t -o "register read --all" -o "thread list" | FileCheck %s

# CHECK-DAG: r0 = 0x0000000000001000
# CHECK-DAG: r16 = 0x0000000000001010
# CHECK-DAG: r26 = 0x000000000000101a
# CHECK-DAG: r29 = 0x000000000000101d
# CHECK-DAG: r30 = 0x00000011ffff8000
# CHECK-DAG: pc = 0x0000000120001234
# CHECK-DAG: unique = 0x0000002aaaaaa000
# CHECK-DAG: f0 = 0.5
# CHECK-DAG: f30 = 30.5
# CHECK-DAG: fpcr = 0x8000000000000000
# CHECK: stop reason = signal SIGSEGV

--- !ELF
FileHeader:
  Class:        ELFCLASS64
  Data:         ELFDATA2LSB
  Type:         ET_CORE
  Machine:      EM_ALPHA
  OSABI:        ELFOSABI_GNU
ProgramHeaders:
  - Type:       PT_NOTE
    FirstSec:   .note
    LastSec:    .note
Sections:
  - Name:       .note
    Type:       SHT_NOTE
    Notes:
      - Name:   CORE
        Desc:   
        Type:   NT_PRSTATUS
      - Name:   CORE
        Desc:   
        Type:   NT_FPREGSET
...
